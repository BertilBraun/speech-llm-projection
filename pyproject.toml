[project]
name = "speech-projector"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6", "torchaudio>=2.6", "transformers>=5.13", "accelerate>=1.10",
  "huggingface-hub>=1.0", "pydantic>=2.10", "numpy>=2.0", "pyarrow>=19",
  "soundfile>=0.13", "scipy>=1.15", "sentence-transformers>=5.0", "matplotlib>=3.10",
  "safetensors>=0.5", "tqdm>=4.67", "jiwer>=4.0", "tensorboard>=2.19",
  "scikit-learn>=1.6", "threadpoolctl>=3.5"
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speech_projector"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
markers = ["integration: requires configured GPU and model/data downloads"]
testpaths = ["tests"]
