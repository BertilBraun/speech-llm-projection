[program:speech-teacher-download]
command=/venv/main/bin/python -B -m scripts.prepare_teacher_data --original-root /workspace/speech-projector/data --output-root /workspace/speech-projector/data_teacher --download --audit
directory=/workspace/speech-projector
environment=OPENBLAS_NUM_THREADS="1",OMP_NUM_THREADS="1",PYTHONDONTWRITEBYTECODE="1"
autostart=false
autorestart=unexpected
startsecs=5
startretries=10
exitcodes=0
stdout_logfile=/workspace/speech-projector/data_teacher/download.stdout.log
stderr_logfile=/workspace/speech-projector/data_teacher/download.stderr.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stopasgroup=true
killasgroup=true
