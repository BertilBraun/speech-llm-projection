[program:speech-download-expansion]
command=/bin/bash /workspace/speech-projector/scripts/run_job.sh -m scripts.download_manifest_audio --root /workspace/speech-projector/data --train-examples 30000 --workers 4
autostart=false
autorestart=unexpected
startretries=5
stdout_logfile=/workspace/speech-projector/data/download_expansion.log
stderr_logfile=/workspace/speech-projector/data/download_expansion_error.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
environment=PROC_NAME="speech-download-expansion"
