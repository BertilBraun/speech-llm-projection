[program:speech-scaling-extension]
command=/bin/bash /workspace/speech-projector/scripts/run_scaling_extension.sh
directory=/workspace/speech-projector
autostart=false
autorestart=unexpected
startsecs=5
startretries=3
exitcodes=0
stdout_logfile=/workspace/speech-projector/results/scaling_extension.log
stderr_logfile=/workspace/speech-projector/results/scaling_extension_error.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
