[program:speech-teacher-cache]
command=/venv/main/bin/python -B -m speech_projector.cache --root /workspace/speech-projector/data_teacher --train-examples 20000 --batch-size 8
directory=/workspace/speech-projector
environment=HF_HOME="/workspace/.hf_home",OPENBLAS_NUM_THREADS="1",OMP_NUM_THREADS="1",PYTHONDONTWRITEBYTECODE="1"
autostart=false
autorestart=unexpected
startsecs=5
startretries=5
exitcodes=0
stdout_logfile=/workspace/speech-projector/data_teacher/cache.stdout.log
stderr_logfile=/workspace/speech-projector/data_teacher/cache.stderr.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stopasgroup=true
killasgroup=true
