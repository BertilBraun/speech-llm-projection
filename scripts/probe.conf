[program:speech-probe]
command=/bin/bash /workspace/speech-projector/scripts/run_job.sh scripts/evaluate_training_probe.py --run-dir /workspace/speech-projector/results/v0_256_mlp_10hz --manifest /workspace/speech-projector/data/examples.jsonl
directory=/workspace/speech-projector
autostart=false
autorestart=false
startsecs=5
exitcodes=0
stdout_logfile=/workspace/speech-projector/results/probe.log
stderr_logfile=/workspace/speech-projector/results/probe_error.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
