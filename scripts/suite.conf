[program:speech-suite]
command=/bin/bash /workspace/speech-projector/scripts/run_job.sh -m speech_projector.launcher --manifest /workspace/speech-projector/data/examples.jsonl --output /workspace/speech-projector/results --suite
directory=/workspace/speech-projector
autostart=false
autorestart=unexpected
startsecs=5
startretries=3
exitcodes=0
stdout_logfile=/workspace/speech-projector/results/suite.log
stderr_logfile=/workspace/speech-projector/results/suite_error.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
stopasgroup=true
killasgroup=true
